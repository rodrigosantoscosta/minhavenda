# MINHAVENDA - Application Properties

# DESABILITAR DOCKER COMPOSE
spring.docker.compose.enabled=false

# Lazy init to reduce memory footprint at startup
spring.main.lazy-initialization=true

# Disable JMX
spring.jmx.enabled=false

# Tomcat - light configuration
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=100
server.tomcat.accept-count=10
server.tomcat.connection-timeout=20000

# SERVER
server.port=8080
server.servlet.context-path=/api

# POSTGRESQL DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000


# JPA
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false

# Disable cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# DESABILITAR RabbitMQ e Redis e SPRING SECURITY
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
#org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
#org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfigurationework.boot.autoconfigure.data.redis.RedisAutoConfiguration

#DESABILITAR Security
#org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

#JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION}

# JACKSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# LOGGING
logging.level.root=WARN
logging.level.br.com.minhavenda=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN


# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# ACTUATOR
management.endpoints.web.exposure.include=health
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never

## DESABILITAR SPRING SECURITY
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

# DEVTOOLS
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# SECURITY
#spring.security.filter.dispatcher-types=REQUEST,ERROR

# Swagger/OpenAPI
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}