# Test properties for unit/integration tests
# Uses H2 in-memory database — no Docker needed

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway — H2 uses ddl-auto instead
spring.flyway.enabled=false

# JWT
security.jwt.secret=7c9b85e74b06fbefafe4499c6874a34354096b7a219c46f8f30777ff16fc4680
security.jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173

# RabbitMQ — disabled for unit tests
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Mail — disabled
app.email.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.root=WARN
logging.level.br.com.minhavenda=INFO
